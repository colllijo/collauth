stages:
  - release

create-changelog:
  stage: release
  image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
  variables:
    CHANGELOG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/changelog?version=${CI_COMMIT_TAG}"
    CHANGELOG_COMMIT_MESSAGE: "docs: Add changelog for ${CI_COMMIT_TAG}"
  script:
    - 'curl -H "PRIVATE-TOKEN: ${CI_API_TOKEN}" "${CHANGELOG_URL}" | jq -r .notes > CHANGELOG.md'
    - 'curl -H "PRIVATE-TOKEN: ${CI_API_TOKEN}" -X POST --data "message=${CHANGELOG_COMMIT_MESSAGE}; [skip ci]" "${CHANGELOG_URL}"'
  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG

create-release-page:
  stage: release
  needs:
    - job: create-changelog
      optional: false
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating gitlab release page for release version ${CI_COMMIT_TAG}"
  release:
    name: Release ${CI_COMMIT_TAG}
    description: CHANGELOG.md
    tag_name: ${CI_COMMIT_TAG}
    ref: ${CI_COMMIT_SHA}
  rules:
    - if: $CI_COMMIT_TAG
